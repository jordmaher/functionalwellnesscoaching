<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional Wellness | Coaching for Professional Women</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --sage: #8A9A5B;
            --cream: #F9F8F4;
            --charcoal: #333333;
            --soft-gold: #C5B358;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--cream);
            color: var(--charcoal);
            line-height: 1.6;
        }

        header {
            background-color: white;
            padding: 2rem 10%;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin: 0;
            color: var(--sage);
        }

        .hero {
            padding: 5rem 10%;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h2 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin-bottom: 1.5rem;
        }

        .hero p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .cta-button {
            background-color: var(--sage);
            color: white;
            padding: 1rem 2.5rem;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: opacity 0.3s;
        }

        .cta-button:hover {
            opacity: 0.9;
        }

        /* Booking Section */
        #booking {
            padding: 4rem 5%;
            background-color: white;
            text-align: center;
        }

        .booking-container {
            max-width: 1000px;
            margin: 0 auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        footer {
            padding: 3rem;
            text-align: center;
            font-size: 0.9rem;
            color: #999;
        }
    </style>
</head>
<body>

    <header>
        <h1>Restore & Thrive</h1>
    </header>

    <section class="hero">
        <h2>From Burnout to Balanced.</h2>
        <p>Functional wellness coaching tailored for the high-performing woman. Reclaim your energy, optimize your hormones, and find your flow again.</p>
        <a href="#booking" class="cta-button">Book Your Discovery Call</a>
    </section>

    <section id="booking">
        <div class="booking-container">
            <iframe src="https://calendar.app.google/K45TQyQXRwY4kwnG8" width="100%" height="700" frameborder="0" scrolling="no"></iframe>
            </div>
    </section>

    <footer>
        <p>&copy; 2024 Restore & Thrive Functional Wellness. All Rights Reserved.</p>
    </footer>

</body>
</html>
